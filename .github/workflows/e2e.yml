name: E2E

on:
  push:
    branches: [main]
  pull_request:

# The E2E smoke run is advisory, not a merge gate: the `verify` job (build +
# typecheck + unit/integration tests) is the authoritative quality gate. E2E
# depends on a Chromium download that can be rate-limited/flaky in CI, so the
# job is allowed to fail without blocking merges. Treat a red E2E as a signal to
# investigate, not a hard stop.
jobs:
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        # Retry the browser download once; it is the most common flaky step.
        run: npx playwright install --with-deps chromium || (sleep 10 && npx playwright install --with-deps chromium)

      - name: Run E2E smoke tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
